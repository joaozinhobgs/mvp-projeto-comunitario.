
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema simples de controle de estoque para pequenos mercados">
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Controle de Estoque</h1>
    <p>Gestão simples para o seu mercadinho</p>
  </header>

  <main>
    <section aria-labelledby="titulo-resumo">
      <h2 id="titulo-resumo">Resumo do estoque</h2>
      <p>Produtos cadastrados: <strong id="total-produtos">0</strong></p>
      <p>Produtos com estoque baixo: <strong id="total-baixo">0</strong></p>
    </section>

    <section aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro">Cadastrar produto</h2>

      <form id="form-produto">
        <label for="nome">Nome do produto</label>
        <input id="nome" name="nome" required maxlength="80">

        <label for="quantidade">Quantidade inicial</label>
        <input id="quantidade" name="quantidade" type="number"
          min="0" step="1" required>

        <label for="minimo">Estoque mínimo</label>
        <input id="minimo" name="minimo" type="number"
          min="0" step="1" required>

        <button type="submit">Cadastrar produto</button>
      </form>
      <p id="mensagem" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="titulo-movimentacao">
      <h2 id="titulo-movimentacao">Entrada ou saída</h2>

      <form id="form-movimentacao">
        <label for="produto">Produto</label>
        <select id="produto" required>
          <option value="">Selecione um produto</option>
        </select>

        <label for="tipo">Tipo de movimentação</label>
        <select id="tipo" required>
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>

        <label for="qtd-movimento">Quantidade</label>
        <input id="qtd-movimento" type="number"
          min="1" step="1" required>

        <button type="submit">Registrar movimentação</button>
      </form>
    </section>

    <section aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Produtos em estoque</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th scope="col">Produto</th>
              <th scope="col">Quantidade</th>
              <th scope="col">Mínimo</th>
              <th scope="col">Situação</th>
            </tr>
          </thead>
          <tbody id="lista-produtos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>MVP acadêmico de controle de estoque.</p>
  </footer>
</body>
</html>
